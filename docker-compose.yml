version: '3.8'

services:

  app:
    build: .
    container_name: employee-management-container
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mydb
    networks:
      - mysql-network
      
  mysql:
    image: mysql:latest
    container_name: mysql-latest
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mydb
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    ports:
      - "3308:3306"
    networks:
      - mysql-network

networks:
  mysql-network: